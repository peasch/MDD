<div class="home-hero" *ngIf="$notLogged() | async">
  <div class="home-hero__image-wrapper">
    <img
      ngSrc="../assets/images/logo_p6.png"
      alt="logo"
      class="home-hero__image"
      width="695"
      height="401"
    />
  </div>

  <h1 class="home-hero__title">Welcome to MDD</h1>

  <div class="home-hero__buttons">
    <button mat-raised-button routerLink="register">S'inscrire</button>
    <button mat-raised-button routerLink="login" >Se connecter</button>
  </div>
</div>
